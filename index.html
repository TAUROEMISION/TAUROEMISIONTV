<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>TAUROEMISIONTV</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        .loading { 
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0; 
            background: #000; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            color: #fff; 
            z-index: 9999; 
        }
        .logo-txt { 
            font-size: 2.2em; 
            font-weight: 900; 
            color: #ff0000; 
            letter-spacing: 2px; 
            text-shadow: 0 0 10px rgba(255,0,0,0.5); 
        }
        .sub-txt { 
            font-size: 1em; 
            color: #fff; 
            margin-top: 5px; 
            opacity: 0.8; 
        }
        .spinner { 
            border: 4px solid rgba(255,0,0,0.1); 
            border-top: 4px solid #ff0000; 
            border-radius: 50%; 
            width: 45px; 
            height: 45px; 
            animation: spin 1s linear infinite; 
            margin-top: 25px; 
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
    </style>
</head>
<body>

    <div class="loading">
        <div class="logo-txt">TAUROEMISION</div>
        <div class="sub-txt">PUERTA GRANDE 2026</div>
        <div class="spinner"></div>
    </div>

    <script>
        // --- URL de tu index real (sin /index, sirve el index.html por defecto) ---
        const TARGET_URL = "https://tauroemision.duckdns.org:5000/";

        // --- Intentar ir a pantalla completa al cargar ---
        function tryFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(() => {}); // ignorar error si el navegador lo bloquea
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen().catch(() => {});
            }
        }

        // --- Redirigir al index real ---
        function redirigir() {
            window.location.href = TARGET_URL;
        }

        // --- En muchos móviles esto se acepta como "gesto" y permite fullscreen al cargar ---
        setTimeout(() => {
            tryFullscreen();
            redirigir();
        }, 500);
    </script>

</body>
</html>
