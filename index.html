<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAUROEMISIONTV</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        
        .contenedor-entrada { 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }

        .logo-txt { 
            font-size: 2.5em; 
            font-weight: 900; 
            color: #ff0000; 
            letter-spacing: 2px; 
            margin-bottom: 30px;
            text-shadow: 0 0 15px rgba(255,0,0,0.6); 
        }

        .btn-entrada {
            background: #ff0000;
            color: white;
            border: none;
            padding: 25px 50px;
            font-size: 1.6em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
            text-transform: uppercase;
            transition: transform 0.2s;
        }

        .btn-entrada:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="contenedor-entrada">
        <div class="logo-txt">TAUROEMISION</div>
        
        <button class="btn-entrada" onclick="entrar()">📺 ENTRAR</button>
    </div>

    <script>
        function entrar() {
            // Intentamos el Full Screen pero SIN esperar a que termine para no bloquear el salto
            const elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen().catch(()=>{}); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen().catch(()=>{}); }

            // Salto inmediato a la plaza
            window.location.href = "https://tauroemision.duckdns.org:5000/";
        }
    </script>

</body>
</html>
